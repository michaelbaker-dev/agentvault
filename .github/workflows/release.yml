name: Release

# Push a tag like v0.1.0 to build the Linux and Mac downloads, record signed
# build provenance for them, and attach them to a GitHub release. Running it
# by hand (workflow_dispatch) builds the downloads without releasing them, to
# test them first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing gets write access unless a job below asks for it.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.os }}
    permissions:
      contents: read
      id-token: write      # to sign the build provenance
      attestations: write  # to store it
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low (2.35), so the binary
          # runs on Debian 12, Ubuntu 22.04+ and similar.
          - arch: x86_64
            os: linux
            runner: ubuntu-22.04
          - arch: aarch64
            os: linux
            runner: ubuntu-22.04-arm
          # Apple silicon. The binary runs on macOS 11 and later.
          - arch: aarch64
            os: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    # The Mac signing secrets live in this environment (see docs/releasing.md).
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Sign with Developer ID and notarize (Mac)
        if: matrix.os == 'macos'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          bin=target/release/agentvault
          if [ -z "$CERT_P12" ]; then
            echo "::warning::No signing certificate in the release environment: the Mac build stays ad-hoc signed."
            exit 0
          fi
          # A throwaway keychain holding only the certificate, deleted at the end.
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(openssl rand -hex 24)
          trap 'security delete-keychain "$kc" 2>/dev/null; rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"' EXIT
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 1800 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)
          [ -n "$identity" ] || { echo "::error::No Developer ID Application certificate in MACOS_CERT_P12"; exit 1; }
          # Hardened runtime and a fixed identifier: the Keychain then trusts
          # every build signed by this team, so automatic unlock survives upgrades.
          codesign --force --timestamp --options runtime --identifier com.agentvault --sign "$identity" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          codesign -d -r- "$bin"
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/agentvault.zip"
          xcrun notarytool submit "$RUNNER_TEMP/agentvault.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status"))' "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id"))' "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            echo "::error::Apple's notary service said: $status"
            exit 1
          fi
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
          OS: ${{ matrix.os }}
        run: |
          # A fixed name, so .../releases/latest/download/agentvault-<arch>-<os>.tar.gz always works.
          name="agentvault-${ARCH}-${OS}"
          mkdir -p "dist/$name"
          if [ "$OS" = macos ]; then
            cp deploy/macos/*.sh "dist/$name/"
          else
            # deploy's own files; deploy/macos is for the Mac archive.
            find deploy -maxdepth 1 -type f -exec cp {} "dist/$name/" \;
          fi
          cp target/release/agentvault README.md LICENSE config.example.toml "dist/$name/"
          cp -r skill "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Record build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentvault-${{ matrix.arch }}-${{ matrix.os }}
          path: dist/*.tar.gz*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # only this job can publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The section under "## <version>" in CHANGELOG.md, up to the next version.
          awk -v v="${TAG#v}" '/^## /{f = (index($0, "## " v " ") == 1)} f' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          body_path: notes.md
