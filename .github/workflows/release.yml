name: Release

# Push a tag like v0.1.0 to build Linux downloads, record signed build
# provenance for them, and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

# Nothing gets write access unless a job below asks for it.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    permissions:
      contents: read
      id-token: write      # to sign the build provenance
      attestations: write  # to store it
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low (2.35), so the binary
          # runs on Debian 12, Ubuntu 22.04+ and similar.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # A fixed name, so .../releases/latest/download/agentvault-<arch>-linux.tar.gz always works.
          name="agentvault-${ARCH}-linux"
          mkdir -p "dist/$name"
          # The Linux files only: deploy/macos is for Mac builds.
          find deploy -maxdepth 1 -type f -exec cp {} "dist/$name/" \;
          cp target/release/agentvault README.md LICENSE config.example.toml "dist/$name/"
          cp -r skill "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Record build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentvault-${{ matrix.arch }}
          path: dist/*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # only this job can publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The section under "## <version>" in CHANGELOG.md, up to the next version.
          awk -v v="${TAG#v}" '/^## /{f = (index($0, "## " v " ") == 1)} f' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          body_path: notes.md
